<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Municipalidad De Asunción - Portal Ciudadano</title>
<style>
/* =====================================================
   VARIABLES (colores reales del sitio original)
   ===================================================== */
:root {
  --palette1: #b02b2d;
  --palette2: #912224;
  --palette3: #000000;
  --palette4: #484848;
  --palette5: #797979;
  --palette6: #a0a0a0;
  --palette7: #EDF2F7;
  --palette8: #F7FAFC;
  --palette9: #ffffff;
  --content-width: 1500px;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  color: var(--palette4);
  background: var(--palette8);
}

a { text-decoration: none; color: inherit; }
img { max-width: 100%; height: auto; display: block; }
button { font-family: inherit; }

.site { background: var(--palette9); max-width: 100%; margin: 0 auto; }
.site-container { max-width: var(--content-width); margin: 0 auto; padding: 0 1.5rem; }

/* =====================================================
   HEADER
   ===================================================== */
.site-header { background: transparent; padding: 20px 0 0; }
.header-top {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 1.5rem 20px;
  position: relative;
}
.logo-img { max-width: 300px; width: 100%; cursor: pointer; }

/* =====================================================
   NAV DESKTOP + DROPDOWNS
   ===================================================== */
.main-nav { padding: 0 1.5rem 15px; display: flex; justify-content: center; }
.main-nav ul { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; }
.main-nav > ul > li { position: relative; }
.main-nav > ul > li > a {
  display: block;
  padding: 0.6em 1.2em;
  color: var(--palette5);
  font-size: 17px;
  font-weight: 400;
  transition: color .2s;
  cursor: pointer;
}
.main-nav > ul > li > a:hover { color: var(--palette1); }
.main-nav > ul > li.current-menu-item > a { color: var(--palette3); }
/* Botón de acceso al sistema EcoRuta (login por roles) */
.main-nav a.nav-acceso {
  color: var(--palette1) !important;
  font-weight: 700;
  border: 2px solid var(--palette1);
  border-radius: 4px;
  padding: 0.4em 1em !important;
  margin-left: 0.5em;
  transition: background .2s, color .2s;
}
.main-nav a.nav-acceso:hover { background: var(--palette1); color: #fff !important; }
.drawer-menu a.drawer-acceso { color: #fff !important; font-weight: 700; }

.main-nav > ul > li.has-children > a::after {
  content: ' ▾';
  font-size: 12px;
  opacity: .6;
  display: inline-block;
  transition: transform .25s ease;
}
.main-nav > ul > li.has-children:hover > a::after { transform: rotate(180deg); }

.main-nav .sub-menu {
  position: absolute;
  top: 100%; left: 0;
  background: var(--palette3);
  box-shadow: 0 2px 13px rgba(0,0,0,.1);
  min-width: 220px;
  z-index: 100;
  padding: 0; margin: 0; list-style: none;
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
}
.main-nav > ul > li:hover > .sub-menu,
.main-nav > ul > li:focus-within > .sub-menu {
  opacity: 1; visibility: visible; transform: translateY(0);
  pointer-events: auto;
  transition: opacity .25s ease, transform .25s ease, visibility 0s linear 0s;
}
.main-nav .sub-menu li { position: relative; }
.main-nav .sub-menu li a {
  display: block;
  padding: 1em;
  width: 220px;
  color: var(--palette8);
  font-size: 12px;
  border-bottom: 1px solid rgba(255,255,255,.1);
  transition: background .2s, color .2s, padding-left .2s;
}
.main-nav .sub-menu li a:hover {
  background: var(--palette4);
  color: var(--palette9);
  padding-left: 1.3em;
}
.main-nav .sub-menu .sub-menu { top: 0; left: 100%; transform: translateX(-8px); }
.main-nav .sub-menu li:hover > .sub-menu,
.main-nav .sub-menu li:focus-within > .sub-menu { transform: translateX(0); }

/* =====================================================
   SLIDER
   ===================================================== */
.slider {
  position: relative; width: 100%; overflow: hidden;
  background: #000; aspect-ratio: 1657 / 442;
}
.slides-track { position: relative; width: 100%; height: 100%; }
.slide {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity .6s ease, visibility 0s linear .6s;
  z-index: 1;
}
.slide.active {
  opacity: 1; visibility: visible; z-index: 2;
  transition: opacity .6s ease, visibility 0s linear 0s;
}
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

.slider-dots {
  position: absolute; bottom: 15px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 10;
}
.slider-dots button {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid #fff; background: transparent;
  cursor: pointer; padding: 0;
  transition: background .2s, transform .2s;
}
.slider-dots button:hover { transform: scale(1.3); }
.slider-dots button.active { background: #fff; }

.slider-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,.4); color: #fff;
  border: none; width: 44px; height: 44px;
  font-size: 24px; cursor: pointer; z-index: 10; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .2s;
}
.slider-arrow.prev { left: 15px; }
.slider-arrow.next { right: 15px; }
.slider-arrow:hover { background: rgba(0,0,0,.7); transform: translateY(-50%) scale(1.1); }

/* =====================================================
   SECCIONES
   ===================================================== */
.section-title {
  background: var(--palette1);
  color: #fff;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 4.8px;
  font-size: 28px;
  font-weight: 700;
  line-height: 50px;
  padding: 8px 20px;
  margin: 40px auto;
}

.noticias-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  padding: 0 1.5rem;
  max-width: var(--content-width);
  margin: 0 auto 40px;
}
.noticia { display: flex; flex-direction: column; cursor: pointer; }
.noticia-thumb { margin-bottom: 1em; overflow: hidden; }
.noticia-thumb img {
  width: 100%; aspect-ratio: 16/9; object-fit: cover;
  transition: transform .4s ease;
}
.noticia:hover .noticia-thumb img { transform: scale(1.05); }
.noticia-cat {
  font-size: 13px; color: var(--palette1);
  text-transform: uppercase; font-weight: 600;
  margin-bottom: 8px; letter-spacing: .5px;
}
.noticia-title {
  font-size: 18px; color: var(--palette3);
  font-weight: 700; line-height: 1.4;
  margin-bottom: 10px; transition: color .2s;
}
.noticia:hover .noticia-title { color: var(--palette1); }
.noticia-date { font-size: 13px; color: var(--palette5); margin-bottom: 12px; }
.noticia-more {
  color: var(--palette1); font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 5px;
  transition: color .2s;
}
.noticia:hover .noticia-more { color: var(--palette2); }

.infobox-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  padding: 0 1.5rem;
  max-width: var(--content-width);
  margin: 60px auto;
}
.infobox {
  background: #fff;
  border: 5px solid var(--palette7);
  padding: 1.5rem;
  margin-top: 50px;
  text-align: left;
  transition: transform .25s ease, box-shadow .25s ease;
  cursor: pointer;
  display: block;
}
.infobox:hover {
  transform: translateY(-6px);
  box-shadow: 0 8px 20px rgba(176,43,45,.12);
}
.infobox-media {
  margin-top: -75px; margin-bottom: 20px;
  display: flex; justify-content: center;
}
.infobox-media img {
  max-width: 88px; border: 5px solid var(--palette7);
  background: #fff; border-radius: 50%;
  width: 88px; height: 88px; object-fit: cover;
}
.infobox h2 {
  font-size: 22px; color: var(--palette3);
  font-weight: 700; margin: 5px 0 10px;
  text-align: center;
}
.infobox p { color: var(--palette4); font-size: 15px; text-align: center; }

.banner-destacado {
  max-width: var(--content-width);
  margin: 40px auto; padding: 0 1.5rem;
}
.banner-destacado img { width: 100%; border-radius: 4px; }
.banner-destacado a { display: block; }

/* =====================================================
   FOOTER
   ===================================================== */
.site-footer {
  background: var(--palette8);
  border-top: 1px solid var(--palette7);
  padding: 30px 1.5rem 20px;
  margin-top: 60px;
}
.footer-social {
  display: flex; justify-content: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 30px;
}

 .footer-social {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 30px;
}

.footer-social a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--palette7);
  color: var(--palette4);
  padding: 10px 16px;
  border-radius: 3px;
  font-size: 13px;
  font-weight: 500;
  transition: background .2s, color .2s;
}

.footer-social a:hover {
  background: var(--palette1);
  color: #fff;
}

.footer-social a svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.footer-social a svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.footer-social a span {
  display: inline-block;
}
.footer-social a:hover {
  background: var(--palette2);
  transform: translateY(-2px);
}
.footer-grid {
  max-width: var(--content-width);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px; text-align: center;
}
.footer-col { font-size: 14px; color: var(--palette4); line-height: 1.8; }
.footer-col img { max-width: 300px; margin: 0 auto 15px; }

/* =====================================================
   WHATSAPP FLOTANTE
   ===================================================== */
.wa-btn {
  position: fixed; bottom: 30px; right: 30px;
  width: 60px; height: 60px;
  background: #2db742; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  z-index: 999;
  transition: transform .2s;
  border: none;
}
.wa-btn:hover { transform: scale(1.1); }
.wa-btn svg { width: 34px; height: 34px; }

/* =====================================================
   DRAWER MOBILE
   ===================================================== */
.mobile-toggle {
  display: none; background: transparent; border: none;
  cursor: pointer; padding: 0.4em 0.6em;
  font-size: 20px; color: var(--palette5);
}
.drawer-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  opacity: 0; visibility: hidden;
  transition: opacity .3s ease, visibility 0s linear .3s;
  z-index: 9998;
}
.drawer-overlay.open {
  opacity: 1; visibility: visible;
  transition: opacity .3s ease, visibility 0s linear 0s;
}
.mobile-drawer {
  position: fixed; top: 0; right: 0;
  width: 320px; max-width: 85vw; height: 100vh;
  background: var(--palette3); color: #fff;
  z-index: 9999;
  transform: translateX(100%);
  transition: transform .3s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.mobile-drawer.open { transform: translateX(0); }
.drawer-header {
  display: flex; justify-content: flex-end;
  padding: 15px 20px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.drawer-close {
  background: transparent; border: none; color: #fff;
  font-size: 28px; cursor: pointer; padding: 0 8px;
  line-height: 1; transition: color .2s;
}
.drawer-close:hover { color: var(--palette1); }
.drawer-menu { list-style: none; padding: 0; margin: 0; }
.drawer-menu li { border-bottom: 1px solid rgba(255,255,255,.1); }
.drawer-menu > li > a,
.drawer-menu > li > .drawer-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 1em 20px;
  color: var(--palette8); font-size: 14px;
  background: transparent; border: none;
  text-align: left; cursor: pointer;
  transition: background .2s, color .2s;
}
.drawer-menu > li > a:hover,
.drawer-menu > li > .drawer-toggle-row:hover {
  background: rgba(255,255,255,.05); color: #fff;
}
.drawer-menu > li.current > a { color: var(--palette1); }
.drawer-toggle-icon { font-size: 14px; transition: transform .25s ease; }
.drawer-menu li.open > .drawer-toggle-row .drawer-toggle-icon { transform: rotate(180deg); }
.drawer-submenu {
  list-style: none; max-height: 0; overflow: hidden;
  background: rgba(255,255,255,.03);
  transition: max-height .35s ease;
}
.drawer-menu li.open > .drawer-submenu { max-height: 1000px; }
.drawer-submenu li a {
  display: block;
  padding: .8em 20px .8em 40px;
  color: var(--palette6); font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,.05);
  transition: color .2s, background .2s;
}
.drawer-submenu li a:hover { color: #fff; background: rgba(255,255,255,.05); }

/* =====================================================
   BUSCADOR
   ===================================================== */
.search-bar {
  max-width: var(--content-width);
  margin: 30px auto 0;
  padding: 0 1.5rem;
}
.search-bar input {
  width: 100%;
  padding: 14px 20px;
  border: 2px solid var(--palette7);
  border-radius: 4px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.search-bar input:focus { border-color: var(--palette1); }

/* =====================================================
   VISTA DETALLE
   ===================================================== */
.vista-detalle { max-width: 900px; margin: 40px auto; padding: 0 1.5rem; }
.vista-detalle .volver {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--palette1); font-weight: 600;
  font-size: 14px; margin-bottom: 25px;
  cursor: pointer;
  transition: color .2s;
}
.vista-detalle .volver:hover { color: var(--palette2); }
.vista-detalle .cat {
  font-size: 13px; color: var(--palette1);
  text-transform: uppercase; font-weight: 600;
  letter-spacing: .5px; margin-bottom: 10px;
}
.vista-detalle h1 {
  font-size: 34px; color: var(--palette3);
  font-weight: 700; line-height: 1.3;
  margin-bottom: 15px;
}
.vista-detalle .fecha { font-size: 14px; color: var(--palette5); margin-bottom: 25px; }
.vista-detalle img.principal { width: 100%; border-radius: 4px; margin-bottom: 30px; }
.vista-detalle .cuerpo p {
  font-size: 17px; line-height: 1.8;
  color: var(--palette4); margin-bottom: 18px;
}

.vista-generica {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 1.5rem;
  text-align: center;
}
.vista-generica h1 {
  font-size: 34px; color: var(--palette3);
  font-weight: 700; margin-bottom: 20px;
}
.vista-generica p {
  font-size: 17px; line-height: 1.8;
  color: var(--palette4); margin-bottom: 30px;
}
.vista-generica .placeholder-box {
  background: var(--palette7);
  border: 2px dashed var(--palette6);
  border-radius: 8px;
  padding: 60px 20px;
  color: var(--palette5);
  font-size: 15px;
}

/* =====================================================
   RESPONSIVE
   ===================================================== */
@media (max-width: 1024px) {
  .noticias-grid, .infobox-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 767px) {
  body { font-size: 15px; }
  .main-nav { display: none; }
  .mobile-toggle { display: block; }
  .header-top { justify-content: center; padding-bottom: 10px; }
  .logo-img { max-width: 250px; }
  .mobile-toggle {
    position: absolute; top: 50%; right: 1.5rem;
    transform: translateY(-50%);
  }
  .noticias-grid, .infobox-row, .footer-grid { grid-template-columns: 1fr; }
  .section-title { font-size: 20px; letter-spacing: 2px; line-height: 40px; }
  .slider { aspect-ratio: 16 / 9; }
  .slider-arrow { width: 36px; height: 36px; font-size: 20px; }
  .vista-detalle h1, .vista-generica h1 { font-size: 24px; }
}
body.drawer-open { overflow: hidden; }
</style>
</head>

  <main id="app"></main>

   ===================================================== */
const sliderSlides = [
  { img: 'img/slide-2.png', href: 'tel:021-627-3010' },
  { img: 'img/slide-3.jpg', href: '#/servicios/patrimonio' },
  { img: 'img/slide-4.jpg', href: '#/tramites/portal' },
  { img: 'img/banner-sati.png', href: '#/tramites/portal' },
];

let sliderCurrent = 0;
let sliderTimer = null;

function renderSlider() {
  return `
    <section class="slider" id="sliderEl">
      <div class="slides-track">
        ${sliderSlides.map((s, i) => `
          <div class="slide ${i === 0 ? 'active' : ''}">
            <a href="${s.href}">
              <img src="${s.img}" alt="Slide ${i + 1}"
                   onerror="this.src='https://placehold.co/1657x442/b02b2d/ffffff?text=${encodeURIComponent(s.img)}'">
            </a>
          </div>
        `).join('')}
      </div>
      <button class="slider-arrow prev" onclick="sliderPrev()" aria-label="Anterior">‹</button>
      <button class="slider-arrow next" onclick="sliderNext()" aria-label="Siguiente">›</button>
      <div class="slider-dots" id="sliderDots">
        ${sliderSlides.map((_, i) => `
          <button class="${i === 0 ? 'active' : ''}" onclick="sliderGo(${i})" aria-label="Ir al slide ${i + 1}"></button>
        `).join('')}
      </div>
    </section>
  `;
}

function updateSliderUI() {
  const slides = document.querySelectorAll('#app .slide');
  const dots = document.querySelectorAll('#app .slider-dots button');
  slides.forEach((s, i) => s.classList.toggle('active', i === sliderCurrent));
  dots.forEach((d, i) => d.classList.toggle('active', i === sliderCurrent));
}
function sliderNext() {
  sliderCurrent = (sliderCurrent + 1) % sliderSlides.length;
  updateSliderUI();
  restartSliderAutoplay();
}
function sliderPrev() {
  sliderCurrent = (sliderCurrent - 1 + sliderSlides.length) % sliderSlides.length;
  updateSliderUI();
  restartSliderAutoplay();
}
function sliderGo(i) {
  sliderCurrent = i;
  updateSliderUI();
  restartSliderAutoplay();
}
function restartSliderAutoplay() {
  clearInterval(sliderTimer);
  sliderTimer = setInterval(() => {
    sliderCurrent = (sliderCurrent + 1) % sliderSlides.length;
    updateSliderUI();
  }, 7000);
}
function attachSliderHover() {
  const el = document.getElementById('sliderEl');
  if (!el) return;
  el.addEventListener('mouseenter', () => clearInterval(sliderTimer));
  el.addEventListener('mouseleave', restartSliderAutoplay);
}

function noticiaCardHTML(n) {
  return `
    <article class="noticia" onclick="navigateTo('#/noticia/${n.id}')">
      <div class="noticia-thumb">
        <img src="${n.img}" alt="${n.title}"
             onerror="this.src='https://picsum.photos/768/1365?random=${n.id}'">
      </div>
      <div class="noticia-cat">${n.cat}</div>
      <h3 class="noticia-title">${n.title}</h3>
      <div class="noticia-date">${n.date}</div>
      <span class="noticia-more">Leer más →</span>
    </article>
  `;
}

function renderNoticiaDetalle(id) {
  const n = noticias.find(x => x.id === Number(id));
  if (!n) return renderGenerica('Noticia no encontrada', 'La noticia que buscás no existe.');
  return `
    <div class="vista-detalle">
      <a href="#/" class="volver">← Volver al inicio</a>
      <div class="cat">${n.cat}</div>
      <h1>${n.title}</h1>
      <div class="fecha">${n.date}</div>
      <img class="principal" src="${n.img}" alt="${n.title}"
           onerror="this.src='https://picsum.photos/1200/675?random=${n.id}'">
      <div class="cuerpo">
        <p>Este es un demo.</p>
        <p>Demo</p>
        <p>Cada una de estas secciones sería alimentada por un CMS real y renderizada.</p>
      </div>
    </div>
  `;
}

function renderGenerica(titulo, descripcion) {
  return `
    <div class="vista-generica">
      <h1>${titulo}</h1>
      <p>${descripcion}</p>
      <div class="placeholder-box">
        Marcos Puto.
      </div>
    </div>
  `;
}

/* =====================================================
   BUSCADOR
   ===================================================== */
function filtrarNoticias(query) {
  const grid = document.getElementById('noticiasGrid');
  if (!grid) return;
  const q = query.toLowerCase().trim();
  const filtradas = q
    ? noticias.filter(n =>
        n.title.toLowerCase().includes(q) ||
        n.cat.toLowerCase().includes(q))
    : noticias;
  grid.innerHTML = filtradas.length
    ? filtradas.map(noticiaCardHTML).join('')
    : '<p style="grid-column:1/-1;text-align:center;color:#797979;">No se encontraron resultados.</p>';
}

/* =====================================================
   ROUTER
   ===================================================== */
function navigateTo(hash) {
  if (window.location.hash === hash) {
    renderRoute();
  } else {
    window.location.hash = hash;
  }
}

function renderRoute() {
  const hash = window.location.hash || '#/';
  const app = document.getElementById('app');

  document.querySelectorAll('.main-nav > ul > li').forEach(li => li.classList.remove('current-menu-item'));

  if (hash.startsWith('#/noticia/')) {
    const id = hash.split('/')[2];
    app.innerHTML = renderNoticiaDetalle(id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  if (hash === '#/' || hash === '') {
    app.innerHTML = renderHome();
    document.querySelectorAll('.main-nav > ul > li').forEach(li => {
      if (li.querySelector('a')?.textContent.trim() === 'Inicio') {
        li.classList.add('current-menu-item');
      }
    });
    attachSliderHover();
    clearInterval(sliderTimer);
    sliderCurrent = 0;
    restartSliderAutoplay();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const partes = hash.replace('#/', '').split('/');
  const path = partes.map(p => decodeURIComponent(p));
  const titulo = path.map(p => {
    const label = encontrarLabel(menuItems, p);
    return label || (p.charAt(0).toUpperCase() + p.slice(1).replace(/-/g, ' '));
  }).join(' › ');

  app.innerHTML = renderGenerica(titulo, 'Sección de demostración educativa.');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function encontrarLabel(items, key) {
  for (const item of items) {
    if (item.href) {
      const slug = item.href.replace('#/', '').split('/').pop();
      if (slug === key) return item.label;
    }
    if (item.children) {
      const found = encontrarLabel(item.children, key);
      if (found) return found;
    }
  }
  return null;
}

window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', renderRoute);
if (document.readyState !== 'loading') renderRoute();
</script>
