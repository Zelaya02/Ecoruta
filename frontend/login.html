<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Critical loading overlay CSS - inline fallback */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 43, 64, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .loading-text {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 600;
            color: #C89D4A;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.5px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: #0a0b0e;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Fondo animado tipo MEGA */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 50%, #0d1b2a 0%, #0a0b0e 70%);
            z-index: -2;
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: orbFloat 20s infinite ease-in-out;
        }

        .orb:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #1a5fb4;
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #2ec27e;
            bottom: -100px;
            left: -100px;
            animation-delay: -7s;
        }

        .orb:nth-child(3) {
            width: 350px;
            height: 350px;
            background: #e66100;
            top: 50%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 40px) scale(0.9); }
            75% { transform: translate(30px, 20px) scale(1.05); }
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(18, 20, 24, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.6);
        }

        .brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand .logo {
            height: 56px;
            margin-bottom: 12px;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .brand p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            color: #fff;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .input-wrapper input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #1a5fb4;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: #1a6fd4;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
            background: #15509e;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .loader {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            display: none;
            background: rgba(192, 57, 43, 0.15);
            border: 1px solid rgba(192, 57, 43, 0.3);
            color: #e74c3c;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 28px 0 20px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.35);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .version {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 440px) {
            .login-card {
                padding: 28px 20px;
                border-radius: 20px;
            }
            .login-wrapper {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand">
                <img src="assets/img/LogoNexo.png" alt="Logo" class="logo">
                <p>Inicia sesión para continuar</p>
            </div>

            <div id="errorMsg" class="error-msg">
                <i class="fas fa-exclamation-circle"></i> Usuario o contraseña incorrectos
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="off" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span id="btnText">Continuar</span>
                    <div id="loader" class="loader"></div>
                </button>
            </form>

            <div class="divider"></div>

            <div class="footer-links">
                <a href="mailto:osvaldozelaya78@gmail.com">Soporte</a>
            </div>

            <div class="version">Routing Intelligence &copy; 2026</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const errorDiv = document.getElementById('errorMsg');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            btnText.textContent = 'Ingresando...';
            loader.style.display = 'block';
            btnLogin.disabled = true;
            errorDiv.style.display = 'none';

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            const utf8Bytes = new TextEncoder().encode(JSON.stringify({ username, password }));
            const authPayload = btoa(String.fromCharCode(...utf8Bytes));

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auth: authPayload })
                });

                const data = await response.json();

                if (data.success) {
                    const userRol = data.rol || 'gestor';
                    localStorage.setItem('nexo_user', data.usuario);
                    localStorage.setItem('nexo_token', data.token);
                    localStorage.setItem('nexo_rol', userRol);
                    btnText.textContent = 'Acceso concedido';
                    setTimeout(() => {
                        const r = (userRol || '').toLowerCase();
                        if (r === 'superadmin') {
                            window.location.href = 'admin.html';
                        } else if (r === 'ciudadano') {
                            window.location.href = 'ciudadano.html';
                        } else {
                            // gestor (rol operativo unificado) -> panel de rutas + denuncias
                            window.location.href = 'index.html';
                        }
                    }, 600);
                } else {
                    throw new Error(data.message || 'Credenciales inválidas');
                }
            } catch (error) {
                console.error(error);
                errorDiv.style.display = 'block';
                passwordInput.value = '';
                btnText.textContent = 'Continuar';
            } finally {
                loader.style.display = 'none';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
