<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoRuta · Glassmorphism Reciclaje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/glass-dialogs.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f3d2e 0%, #1a5f4a 50%, #2d8f6f 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-bg-hover: rgba(255, 255, 255, 0.09);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-blur: blur(28px) saturate(160%);
            --primary: #3fa87d;
            --primary-hover: #4bc48f;
            --accent: #7dffc4;
            --accent-lime: #a8e063;
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.65);
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --glow: 0 0 40px rgba(125, 255, 196, 0.35);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Círculos decorativos difuminados */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: #7dffc4;
            opacity: 0.35;
            top: -150px;
            left: -150px;
            animation: float1 12s ease-in-out infinite;
        }

        body::after {
            width: 450px;
            height: 450px;
            background: #a8e063;
            opacity: 0.28;
            bottom: -150px;
            right: -150px;
            animation: float2 15s ease-in-out infinite;
        }

        @keyframes float1 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(40px, 30px) scale(1.1);
            }
        }

        @keyframes float2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-40px, -30px) scale(1.08);
            }
        }

        /* Iconos reciclaje flotantes en el fondo */
        .recycle-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .recycle-bg span {
            position: absolute;
            color: rgba(255, 255, 255, 0.06);
            font-size: 120px;
            animation: spinSlow 25s linear infinite;
        }

        .recycle-bg span:nth-child(1) {
            top: 10%;
            left: 8%;
            font-size: 90px;
            animation-duration: 30s;
        }

        .recycle-bg span:nth-child(2) {
            top: 60%;
            left: 15%;
            font-size: 130px;
            animation-duration: 40s;
            animation-direction: reverse;
        }

        .recycle-bg span:nth-child(3) {
            top: 20%;
            right: 10%;
            font-size: 110px;
            animation-duration: 35s;
        }

        .recycle-bg span:nth-child(4) {
            bottom: 15%;
            right: 20%;
            font-size: 80px;
            animation-duration: 28s;
            animation-direction: reverse;
        }

        @keyframes spinSlow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* 🧊 Card Glass con efecto avanzado */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow:
                0 8px 32px 0 rgba(0, 0, 0, 0.3),
                0 2px 8px 0 rgba(0, 0, 0, 0.15),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.06),
                inset 1px 0 0 0 rgba(255, 255, 255, 0.08),
                inset -1px 0 0 0 rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.6s ease-out;
            overflow: hidden;
        }

        /* ✨ Reflejo de luz diagonal (vidrio) */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(115deg,
                    transparent 40%,
                    rgba(255, 255, 255, 0.08) 45%,
                    rgba(255, 255, 255, 0.15) 50%,
                    rgba(255, 255, 255, 0.08) 55%,
                    transparent 60%);
            pointer-events: none;
            animation: shine 6s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes shine {

            0%,
            100% {
                transform: translateX(-30%) translateY(-30%);
            }

            50% {
                transform: translateX(30%) translateY(30%);
            }
        }

        /* 🌫️ Brillo superior tipo vidrio */
        .glass-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 140px;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.12) 0%,
                    rgba(255, 255, 255, 0.03) 40%,
                    transparent 100%);
            border-radius: 24px 24px 0 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Contenido por encima de los efectos */
        .glass-card>* {
            position: relative;
            z-index: 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Volver al portal */
        .back-portal-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 18px;
            transition: var(--transition);
        }

        .back-portal-link:hover {
            color: var(--accent);
            transform: translateX(-3px);
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, #56ab2f 100%);
            border-radius: 14px;
            font-size: 26px;
            box-shadow: 0 6px 20px rgba(63, 168, 125, 0.5), var(--glow);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 6px 20px rgba(63, 168, 125, 0.5), 0 0 30px rgba(125, 255, 196, 0.3);
            }

            50% {
                box-shadow: 0 6px 20px rgba(63, 168, 125, 0.7), 0 0 50px rgba(125, 255, 196, 0.5);
            }
        }

        .logo-text {
            color: var(--text-primary);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--accent);
        }

        /* Header */
        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h1 {
            color: var(--text-primary);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.05rem;
            transition: var(--transition);
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 46px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-wrapper input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent);
            box-shadow:
                0 0 0 3px rgba(125, 255, 196, 0.2),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
        }

        .input-wrapper input:focus~.icon {
            color: var(--accent);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.05rem;
            padding: 4px;
            transition: var(--transition);
        }

        .toggle-password:hover {
            color: var(--accent);
        }

        /* Row: remember / forgot */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-wrapper input {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .checkbox-wrapper input:checked {
            background: linear-gradient(135deg, var(--primary) 0%, #56ab2f 100%);
            border-color: var(--accent);
        }

        .checkbox-wrapper input:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .forgot-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: var(--accent-lime);
            text-decoration: underline;
        }

        /* Button */
        .btn-primary {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, var(--primary) 0%, #56ab2f 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.3px;
            box-shadow:
                0 6px 20px rgba(63, 168, 125, 0.4),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.3),
                    transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-hover) 0%, #6fc93d 100%);
            box-shadow: 0 8px 28px rgba(63, 168, 125, 0.6), var(--glow);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Social buttons */
        .social-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-social {
            flex: 1;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Footer */
        .card-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .card-footer a:hover {
            color: var(--accent-lime);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .glass-card {
                padding: 28px 24px;
            }

            .card-header h1 {
                font-size: 1.5rem;
            }

            .recycle-bg span {
                font-size: 70px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Iconos de reciclaje flotantes en el fondo -->
    <div class="recycle-bg" aria-hidden="true">
        <span>♻</span>
        <span>♻</span>
        <span>♻</span>
        <span>♻</span>
    </div>

    <!-- Card de Login Glassmorphism -->
    <main class="glass-card" role="main">

        <a href="/" id="backToPortal" class="back-portal-link" title="Regresar al Portal Ciudadano">← Volver al Portal Ciudadano</a>

        <div class="logo">
            <div class="logo-icon">♻</div>
            <div class="logo-text">Eco<span>Ruta</span></div>
        </div>

        <header class="card-header">
            <h1>Bienvenido de nuevo</h1>
            <p>Inicia sesión y sigue reciclando el futuro</p>
        </header>

        <form id="loginForm" autocomplete="on">

            <div class="form-group">
                <label for="username">Usuario</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="tu_usuario" required
                        autocomplete="username" />
                    <span class="icon">✉</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        minlength="6" />
                    <span class="icon">🔒</span>
                    <button type="button" class="toggle-password" id="togglePassword"
                        aria-label="Mostrar contraseña">👁</button>
                </div>
            </div>

            <div class="form-row">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="remember" name="remember" />
                    <span>Recuérdame</span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <div id="errorMsg" style="display:none; color:#ff8f8f; font-size:0.9rem; margin:0 0 12px; text-align:center;"></div>

            <button type="submit" class="btn-primary">Iniciar sesión</button>

            <div class="divider">o continúa con</div>

            <div class="social-row">
                <button type="button" class="btn-social">
                    <span>🔵</span> Google
                </button>
            </div>

            <p class="card-footer">
                ¿No tienes cuenta? <a href="#">Regístrate gratis</a>
            </p>

        </form>
    </main>

    <script>
        // Adaptar enlace de retorno si se abre localmente por file://
        const backPortal = document.getElementById('backToPortal');
        if (backPortal && window.location.protocol === 'file:') {
            backPortal.href = '../muni-demo/index.html';
        }

        // Toggle de contraseña
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.innerHTML = isPassword ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
            togglePassword.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });

        // Login real contra /api/login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-primary');
            const errorDiv = document.getElementById('errorMsg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return;

            btn.textContent = 'Iniciando...';
            btn.disabled = true;
            btn.style.opacity = '0.7';
            errorDiv.style.display = 'none';

            try {
                const utf8Bytes = new TextEncoder().encode(JSON.stringify({ username, password }));
                const authPayload = btoa(String.fromCharCode(...utf8Bytes));

                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auth: authPayload })
                });
                const data = await response.json();

                if (!data.success) throw new Error(data.message || 'Credenciales inválidas');

                const userRol = data.rol || 'gestor';
                localStorage.setItem('ecoruta_user', data.usuario);
                localStorage.setItem('nexo_user', data.usuario);
                localStorage.setItem('ecoruta_token', data.token);
                localStorage.setItem('nexo_token', data.token);
                localStorage.setItem('ecoruta_rol', userRol);
                localStorage.setItem('nexo_rol', userRol);
                if (data.chofer_id) {
                    localStorage.setItem('ecoruta_chofer_id', data.chofer_id);
                }

                btn.textContent = 'Acceso Concedido';
                btn.style.background = 'linear-gradient(135deg, #7dffc4 0%, #a8e063 100%)';
                btn.style.color = '#0f3d2e';

                setTimeout(() => {
                    const r = (userRol || '').toLowerCase();
                    if (r === 'superadmin') {
                        window.location.href = 'admin.html';
                    } else if (r === 'ciudadano') {
                        window.location.href = 'ciudadano.html';
                    } else if (r === 'chofer') {
                        window.location.href = 'chofer.html';
                    } else {
                        // gestor (rol operativo unificado) -> panel de rutas + denuncias
                        window.location.href = 'index.html';
                    }
                }, 500);
            } catch (error) {
                console.error(error);
                errorDiv.textContent = error.message || 'Error al iniciar sesión';
                errorDiv.style.display = 'block';
                btn.textContent = 'Iniciar sesión';
                btn.disabled = false;
                btn.style.opacity = '1';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>

</html>
