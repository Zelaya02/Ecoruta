<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Municipalidad De Asunción - Portal Ciudadano</title>
<style>
/* =====================================================
   VARIABLES (colores reales del sitio original)
   ===================================================== */
:root {
  --palette1: #b02b2d;
  --palette2: #912224;
  --palette3: #000000;
  --palette4: #484848;
  --palette5: #797979;
  --palette6: #a0a0a0;
  --palette7: #EDF2F7;
  --palette8: #F7FAFC;
  --palette9: #ffffff;
  --content-width: 1500px;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  color: var(--palette4);
  background: var(--palette8);
}

a { text-decoration: none; color: inherit; }
img { max-width: 100%; height: auto; display: block; }
button { font-family: inherit; }

.site { background: var(--palette9); max-width: 100%; margin: 0 auto; }
.site-container { max-width: var(--content-width); margin: 0 auto; padding: 0 1.5rem; }

/* =====================================================
   HEADER
   ===================================================== */
.site-header { background: transparent; padding: 20px 0 0; }
.header-top {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 1.5rem 20px;
  position: relative;
}
.logo-img { max-width: 300px; width: 100%; cursor: pointer; }

/* =====================================================
   NAV DESKTOP + DROPDOWNS
   ===================================================== */
.main-nav { padding: 0 1.5rem 15px; display: flex; justify-content: center; }
.main-nav ul { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; }
.main-nav > ul > li { position: relative; }
.main-nav > ul > li > a {
  display: block;
  padding: 0.6em 1.2em;
  color: var(--palette5);
  font-size: 17px;
  font-weight: 400;
  transition: color .2s;
  cursor: pointer;
}
.main-nav > ul > li > a:hover { color: var(--palette1); }
.main-nav > ul > li.current-menu-item > a { color: var(--palette3); }
/* Botón de acceso al sistema NEXO en la navegación */
.main-nav a.nav-acceso {
  background: var(--palette1) !important;
  color: #ffffff !important;
  font-weight: 700 !important;
  border: 2px solid var(--palette1);
  border-radius: 6px;
  padding: 0.45em 1.2em !important;
  margin-left: 0.8em;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 2px 8px rgba(176, 43, 45, 0.28);
  transition: all .25s ease;
  letter-spacing: 0.3px;
}
.main-nav a.nav-acceso:hover {
  background: var(--palette2) !important;
  border-color: var(--palette2) !important;
  color: #ffffff !important;
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(176, 43, 45, 0.38);
}
.drawer-menu a.drawer-acceso {
  background: var(--palette1) !important;
  color: #ffffff !important;
  font-weight: 700;
  display: block;
  border-radius: 6px;
  padding: 0.85em 1.2em;
  margin: 12px 1.5rem;
  text-align: center;
  box-shadow: 0 3px 10px rgba(176, 43, 45, 0.3);
  transition: background .2s ease;
}
.drawer-menu a.drawer-acceso:hover {
  background: var(--palette2) !important;
}

/* =====================================================
   SECCIÓN DE PRESENTACIÓN: SISTEMA ECORUTA ASUNCIÓN
   (Diseño 100% integrado al estilo institucional del portal)
   ===================================================== */
.ecoruta-presentation {
  max-width: var(--content-width);
  margin: 0 auto 50px;
  padding: 0 1.5rem;
}
.ecoruta-card-main {
  background: #ffffff;
  border: 1px solid var(--palette7);
  border-radius: 8px;
  padding: 2.5rem;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
}
.ecoruta-header-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--palette7);
  color: var(--palette1);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 6px 14px;
  border-radius: 4px;
  margin-bottom: 16px;
}
.ecoruta-title {
  font-size: 30px;
  font-weight: 700;
  color: var(--palette3);
  line-height: 1.3;
  margin-bottom: 12px;
}
.ecoruta-lead {
  font-size: 17px;
  line-height: 1.7;
  color: var(--palette4);
  max-width: 1050px;
  margin-bottom: 30px;
}
.ecoruta-stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 35px;
}
.ecoruta-stat-card {
  background: var(--palette8);
  border: 1px solid var(--palette7);
  border-radius: 6px;
  padding: 18px 22px;
  border-left: 4px solid var(--palette1);
  transition: transform .2s ease;
}
.ecoruta-stat-card:hover {
  transform: translateY(-2px);
}
.ecoruta-stat-num {
  font-size: 28px;
  font-weight: 800;
  color: var(--palette1);
  line-height: 1.1;
  margin-bottom: 4px;
}
.ecoruta-stat-label {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--palette3);
  margin-bottom: 2px;
}
.ecoruta-stat-desc {
  font-size: 12.5px;
  color: var(--palette5);
  line-height: 1.4;
}
.ecoruta-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 35px;
}
.ecoruta-feature-card {
  background: #ffffff;
  border: 1px solid var(--palette7);
  border-radius: 6px;
  padding: 22px 18px;
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  display: flex;
  flex-direction: column;
}
.ecoruta-feature-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(176, 43, 45, 0.08);
  border-color: rgba(176, 43, 45, 0.3);
}
.ecoruta-feature-icon {
  width: 44px;
  height: 44px;
  background: var(--palette8);
  border: 1px solid var(--palette7);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  color: var(--palette1);
}
.ecoruta-feature-icon svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
}
.ecoruta-feature-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--palette3);
  margin-bottom: 8px;
  line-height: 1.35;
}
.ecoruta-feature-text {
  font-size: 14px;
  color: var(--palette4);
  line-height: 1.6;
  flex: 1;
}
.ecoruta-actions-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  padding-top: 25px;
  border-top: 1px solid var(--palette7);
}
.ecoruta-btn-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--palette1);
  color: #ffffff !important;
  font-size: 15px;
  font-weight: 700;
  padding: 12px 26px;
  border-radius: 6px;
  transition: all .2s ease;
  box-shadow: 0 3px 8px rgba(176, 43, 45, 0.25);
  text-decoration: none;
}
.ecoruta-btn-cta:hover {
  background: var(--palette2);
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(145, 34, 36, 0.35);
}
.ecoruta-btn-cta svg {
  width: 17px;
  height: 17px;
  stroke: currentColor;
}
.ecoruta-btn-outline {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  color: var(--palette4) !important;
  font-size: 15px;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 6px;
  border: 1px solid var(--palette6);
  transition: all .2s ease;
  text-decoration: none;
}
.ecoruta-btn-outline:hover {
  background: var(--palette8);
  color: var(--palette1) !important;
  border-color: var(--palette1);
}
@media (max-width: 1024px) {
  .ecoruta-stats-row { grid-template-columns: repeat(3, 1fr); }
  .ecoruta-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 767px) {
  .ecoruta-card-main { padding: 1.5rem; }
  .ecoruta-title { font-size: 22px; }
  .ecoruta-stats-row { grid-template-columns: 1fr; }
  .ecoruta-grid { grid-template-columns: 1fr; }
}

.main-nav > ul > li.has-children > a::after {
  content: ' ▾';
  font-size: 12px;
  opacity: .6;
  display: inline-block;
  transition: transform .25s ease;
}
.main-nav > ul > li.has-children:hover > a::after { transform: rotate(180deg); }

.main-nav .sub-menu {
  position: absolute;
  top: 100%; left: 0;
  background: var(--palette3);
  box-shadow: 0 2px 13px rgba(0,0,0,.1);
  min-width: 220px;
  z-index: 100;
  padding: 0; margin: 0; list-style: none;
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
}
.main-nav > ul > li:hover > .sub-menu,
.main-nav > ul > li:focus-within > .sub-menu {
  opacity: 1; visibility: visible; transform: translateY(0);
  pointer-events: auto;
  transition: opacity .25s ease, transform .25s ease, visibility 0s linear 0s;
}
.main-nav .sub-menu li { position: relative; }
.main-nav .sub-menu li a {
  display: block;
  padding: 1em;
  width: 220px;
  color: var(--palette8);
  font-size: 12px;
  border-bottom: 1px solid rgba(255,255,255,.1);
  transition: background .2s, color .2s, padding-left .2s;
}
.main-nav .sub-menu li a:hover {
  background: var(--palette4);
  color: var(--palette9);
  padding-left: 1.3em;
}
.main-nav .sub-menu .sub-menu { top: 0; left: 100%; transform: translateX(-8px); }
.main-nav .sub-menu li:hover > .sub-menu,
.main-nav .sub-menu li:focus-within > .sub-menu { transform: translateX(0); }

/* =====================================================
   SLIDER
   ===================================================== */
.slider {
  position: relative; width: 100%; overflow: hidden;
  background: #000; aspect-ratio: 1657 / 442;
}
.slides-track { position: relative; width: 100%; height: 100%; }
.slide {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity .6s ease, visibility 0s linear .6s;
  z-index: 1;
}
.slide.active {
  opacity: 1; visibility: visible; z-index: 2;
  transition: opacity .6s ease, visibility 0s linear 0s;
}
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

.slider-dots {
  position: absolute; bottom: 15px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 10;
}
.slider-dots button {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid #fff; background: transparent;
  cursor: pointer; padding: 0;
  transition: background .2s, transform .2s;
}
.slider-dots button:hover { transform: scale(1.3); }
.slider-dots button.active { background: #fff; }

.slider-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,.4); color: #fff;
  border: none; width: 44px; height: 44px;
  font-size: 24px; cursor: pointer; z-index: 10; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .2s;
}
.slider-arrow.prev { left: 15px; }
.slider-arrow.next { right: 15px; }
.slider-arrow:hover { background: rgba(0,0,0,.7); transform: translateY(-50%) scale(1.1); }

/* =====================================================
   SECCIONES
   ===================================================== */
.section-title {
  background: var(--palette1);
  color: #fff;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 4.8px;
  font-size: 28px;
  font-weight: 700;
  line-height: 50px;
  padding: 8px 20px;
  margin: 40px auto;
}

.noticias-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  padding: 0 1.5rem;
  max-width: var(--content-width);
  margin: 0 auto 40px;
}
.noticia { display: flex; flex-direction: column; cursor: pointer; }
.noticia-thumb { margin-bottom: 1em; overflow: hidden; }
.noticia-thumb img {
  width: 100%; aspect-ratio: 16/9; object-fit: cover;
  transition: transform .4s ease;
}
.noticia:hover .noticia-thumb img { transform: scale(1.05); }
.noticia-cat {
  font-size: 13px; color: var(--palette1);
  text-transform: uppercase; font-weight: 600;
  margin-bottom: 8px; letter-spacing: .5px;
}
.noticia-title {
  font-size: 18px; color: var(--palette3);
  font-weight: 700; line-height: 1.4;
  margin-bottom: 10px; transition: color .2s;
}
.noticia:hover .noticia-title { color: var(--palette1); }
.noticia-date { font-size: 13px; color: var(--palette5); margin-bottom: 12px; }
.noticia-more {
  color: var(--palette1); font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 5px;
  transition: color .2s;
}
.noticia:hover .noticia-more { color: var(--palette2); }

.infobox-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  padding: 0 1.5rem;
  max-width: var(--content-width);
  margin: 60px auto;
}
.infobox {
  background: #fff;
  border: 5px solid var(--palette7);
  padding: 1.5rem;
  margin-top: 50px;
  text-align: left;
  transition: transform .25s ease, box-shadow .25s ease;
  cursor: pointer;
  display: block;
}
.infobox:hover {
  transform: translateY(-6px);
  box-shadow: 0 8px 20px rgba(176,43,45,.12);
}
.infobox-media {
  margin-top: -75px; margin-bottom: 20px;
  display: flex; justify-content: center;
}
.infobox-media img {
  max-width: 88px; border: 5px solid var(--palette7);
  background: #fff; border-radius: 50%;
  width: 88px; height: 88px; object-fit: cover;
}
.infobox h2 {
  font-size: 22px; color: var(--palette3);
  font-weight: 700; margin: 5px 0 10px;
  text-align: center;
}
.infobox p { color: var(--palette4); font-size: 15px; text-align: center; }

.banner-destacado {
  max-width: var(--content-width);
  margin: 40px auto; padding: 0 1.5rem;
}
.banner-destacado img { width: 100%; border-radius: 4px; }
.banner-destacado a { display: block; }

/* =====================================================
   FOOTER
   ===================================================== */
.site-footer {
  background: var(--palette8);
  border-top: 1px solid var(--palette7);
  padding: 30px 1.5rem 20px;
  margin-top: 60px;
}
.footer-social {
  display: flex; justify-content: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 30px;
}

 .footer-social {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 30px;
}

.footer-social a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--palette7);
  color: var(--palette4);
  padding: 10px 16px;
  border-radius: 3px;
  font-size: 13px;
  font-weight: 500;
  transition: background .2s, color .2s;
}

.footer-social a:hover {
  background: var(--palette1);
  color: #fff;
}

.footer-social a svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.footer-social a svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.footer-social a span {
  display: inline-block;
}
.footer-social a:hover {
  background: var(--palette2);
  transform: translateY(-2px);
}
.footer-grid {
  max-width: var(--content-width);
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px; text-align: center;
}
.footer-col { font-size: 14px; color: var(--palette4); line-height: 1.8; }
.footer-col img { max-width: 300px; margin: 0 auto 15px; }

/* =====================================================
   WHATSAPP FLOTANTE
   ===================================================== */
.wa-btn {
  position: fixed; bottom: 30px; right: 30px;
  width: 60px; height: 60px;
  background: #2db742; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  z-index: 999;
  transition: transform .2s;
  border: none;
}
.wa-btn:hover { transform: scale(1.1); }
.wa-btn svg { width: 34px; height: 34px; }

/* =====================================================
   DRAWER MOBILE
   ===================================================== */
.mobile-toggle {
  display: none; background: transparent; border: none;
  cursor: pointer; padding: 0.4em 0.6em;
  font-size: 20px; color: var(--palette5);
}
.drawer-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  opacity: 0; visibility: hidden;
  transition: opacity .3s ease, visibility 0s linear .3s;
  z-index: 9998;
}
.drawer-overlay.open {
  opacity: 1; visibility: visible;
  transition: opacity .3s ease, visibility 0s linear 0s;
}
.mobile-drawer {
  position: fixed; top: 0; right: 0;
  width: 320px; max-width: 85vw; height: 100vh;
  background: var(--palette3); color: #fff;
  z-index: 9999;
  transform: translateX(100%);
  transition: transform .3s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.mobile-drawer.open { transform: translateX(0); }
.drawer-header {
  display: flex; justify-content: flex-end;
  padding: 15px 20px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.drawer-close {
  background: transparent; border: none; color: #fff;
  font-size: 28px; cursor: pointer; padding: 0 8px;
  line-height: 1; transition: color .2s;
}
.drawer-close:hover { color: var(--palette1); }
.drawer-menu { list-style: none; padding: 0; margin: 0; }
.drawer-menu li { border-bottom: 1px solid rgba(255,255,255,.1); }
.drawer-menu > li > a,
.drawer-menu > li > .drawer-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 1em 20px;
  color: var(--palette8); font-size: 14px;
  background: transparent; border: none;
  text-align: left; cursor: pointer;
  transition: background .2s, color .2s;
}
.drawer-menu > li > a:hover,
.drawer-menu > li > .drawer-toggle-row:hover {
  background: rgba(255,255,255,.05); color: #fff;
}
.drawer-menu > li.current > a { color: var(--palette1); }
.drawer-toggle-icon { font-size: 14px; transition: transform .25s ease; }
.drawer-menu li.open > .drawer-toggle-row .drawer-toggle-icon { transform: rotate(180deg); }
.drawer-submenu {
  list-style: none; max-height: 0; overflow: hidden;
  background: rgba(255,255,255,.03);
  transition: max-height .35s ease;
}
.drawer-menu li.open > .drawer-submenu { max-height: 1000px; }
.drawer-submenu li a {
  display: block;
  padding: .8em 20px .8em 40px;
  color: var(--palette6); font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,.05);
  transition: color .2s, background .2s;
}
.drawer-submenu li a:hover { color: #fff; background: rgba(255,255,255,.05); }

/* =====================================================
   BUSCADOR
   ===================================================== */
.search-bar {
  max-width: var(--content-width);
  margin: 30px auto 0;
  padding: 0 1.5rem;
}
.search-bar input {
  width: 100%;
  padding: 14px 20px;
  border: 2px solid var(--palette7);
  border-radius: 4px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.search-bar input:focus { border-color: var(--palette1); }

/* =====================================================
   VISTA DETALLE
   ===================================================== */
.vista-detalle { max-width: 900px; margin: 40px auto; padding: 0 1.5rem; }
.vista-detalle .volver {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--palette1); font-weight: 600;
  font-size: 14px; margin-bottom: 25px;
  cursor: pointer;
  transition: color .2s;
}
.vista-detalle .volver:hover { color: var(--palette2); }
.vista-detalle .cat {
  font-size: 13px; color: var(--palette1);
  text-transform: uppercase; font-weight: 600;
  letter-spacing: .5px; margin-bottom: 10px;
}
.vista-detalle h1 {
  font-size: 34px; color: var(--palette3);
  font-weight: 700; line-height: 1.3;
  margin-bottom: 15px;
}
.vista-detalle .fecha { font-size: 14px; color: var(--palette5); margin-bottom: 25px; }
.vista-detalle img.principal { width: 100%; border-radius: 4px; margin-bottom: 30px; }
.vista-detalle .cuerpo p {
  font-size: 17px; line-height: 1.8;
  color: var(--palette4); margin-bottom: 18px;
}

.vista-generica {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 1.5rem;
  text-align: center;
}
.vista-generica h1 {
  font-size: 34px; color: var(--palette3);
  font-weight: 700; margin-bottom: 20px;
}
.vista-generica p {
  font-size: 17px; line-height: 1.8;
  color: var(--palette4); margin-bottom: 30px;
}
.vista-generica .placeholder-box {
  background: var(--palette7);
  border: 2px dashed var(--palette6);
  border-radius: 8px;
  padding: 60px 20px;
  color: var(--palette5);
  font-size: 15px;
}

/* =====================================================
   RESPONSIVE
   ===================================================== */
@media (max-width: 1024px) {

.denuncias-container {
  max-width: var(--content-width);
  margin: 20px auto 60px;
  padding: 0 1.5rem;
}
.denuncias-card {
  background: #ffffff;
  border: 1px solid var(--palette7);
  border-top: 5px solid var(--palette1);
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
  padding: 3rem 2.5rem;
  position: relative;
}
.denuncias-header {
  text-align: center;
  max-width: 860px;
  margin: 0 auto 2.5rem;
}
.denuncias-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fdf2f2;
  color: var(--palette1);
  border: 1px solid #fecaca;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 6px 18px;

  font-weight: 800;
  line-height: 1.25;

}
.denuncias-header p {
  color: var(--palette4);
  font-size: 17.5px;
  line-height: 1.6;
}
.denuncias-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  margin-bottom: 2.8rem;
}
.denuncia-step {
  background: var(--palette8);
  border: 1px solid var(--palette7);
  border-radius: 10px;
  padding: 2rem 1.8rem;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  display: flex;
  flex-direction: column;
}
.denuncia-step:hover {
  transform: translateY(-6px);
  box-shadow: 0 10px 22px rgba(176, 43, 45, 0.08);
  border-color: #cbd5e1;
}
.step-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.step-number {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--palette1);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
}
.step-icon {
  font-size: 28px;
}
.denuncia-step h4 {
  font-size: 19px;
  color: var(--palette3);
  font-weight: 700;
  margin-bottom: 10px;
  line-height: 1.35;
}
.denuncia-step p {
  font-size: 15px;
  color: var(--palette5);
  line-height: 1.6;
}
.denuncias-cta-box {
  background: linear-gradient(135deg, #fff7f7 0%, #ffffff 100%);
  border: 2px dashed #f0b8b9;
  border-radius: 10px;
  padding: 2.5rem 2rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.denuncias-cta-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--palette3);
}
.denuncias-cta-desc {
  max-width: 720px;
  font-size: 16px;
  color: var(--palette4);
  line-height: 1.55;
}
.denuncias-actions {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 8px;
}
.btn-muni-principal {
  background: var(--palette1);
  color: #ffffff !important;
  font-size: 16px;
  font-weight: 700;
  padding: 13px 30px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 14px rgba(176, 43, 45, 0.28);
  transition: all 0.25s ease;
  text-decoration: none;
  cursor: pointer;
}
.btn-muni-principal:hover {
  background: var(--palette2);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(176, 43, 45, 0.4);
  color: #ffffff !important;
}
.btn-muni-secundario {
  background: #ffffff;
  color: var(--palette1) !important;
  border: 2px solid var(--palette1);
  font-size: 16px;
  font-weight: 700;
  padding: 13px 26px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.25s ease;
  text-decoration: none;
  cursor: pointer;
}
.btn-muni-secundario:hover {
  background: #fdf2f2;
  transform: translateY(-2px);
  color: var(--palette1) !important;
}
.denuncias-stats-row {
  display: flex;

}
.stat-val {
  font-size: 24px;

  color: var(--palette1);
  line-height: 1.2;
}
.stat-lbl {
  font-size: 12px;
  color: var(--palette5);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 600;
}
@media (max-width: 900px) {

}

function renderNavItems(items) {
  return items.map((item) => {
    const hasChildren = item.children && item.children.length;
    return `
      <li class="${hasChildren ? 'has-children' : ''}">
        <a href="${item.href || '#'}"${item.cls ? ` class="${item.cls}"` : ''}>${item.label}</a>
        ${hasChildren ? `<ul class="sub-menu">${renderNavItems(item.children)}</ul>` : ''}
      </li>
    `;
  }).join('');
}
document.getElementById('navDesktop').innerHTML = renderNavItems(menuItems);

/* =====================================================
   RENDER: DRAWER MOBILE
   ===================================================== */
function renderDrawerItems(items) {
  return items.map((item) => {
    const hasChildren = item.children && item.children.length;
    if (!hasChildren) {
      const dCls = item.cls === 'nav-acceso' ? 'drawer-acceso' : (item.cls || '');
      return `<li><a href="${item.href || '#'}"${dCls ? ` class="${dCls}"` : ''}>${item.label}</a></li>`;
    }
    return `
      <li>
        <button class="drawer-toggle-row">${item.label} <span class="drawer-toggle-icon">▾</span></button>
        <ul class="drawer-submenu">
          ${item.children.map(child => `<li><a href="${child.href || '#'}">${child.label}</a></li>`).join('')}
        </ul>
      </li>
    `;
  }).join('');
}

   ===================================================== */
const drawer = document.getElementById('mobileDrawer');
const overlay = document.getElementById('drawerOverlay');
const openBtn = document.getElementById('openDrawer');
const closeBtn = document.getElementById('closeDrawer');

function openDrawer() {
  drawer.classList.add('open');
  overlay.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
  document.body.classList.add('drawer-open');
}
function closeDrawer() {
  drawer.classList.remove('open');
  overlay.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('drawer-open');
}
openBtn.addEventListener('click', openDrawer);
closeBtn.addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
});
document.querySelectorAll('.drawer-toggle-row').forEach(btn => {
  btn.addEventListener('click', () => btn.parentElement.classList.toggle('open'));
});

/* =====================================================
   SLIDER  ->  img/slide-1.jpg ... slide-4.jpg
   ===================================================== */
const sliderSlides = [
  { img: 'img/slide-2.png', href: 'tel:021-627-3010' },
  { img: 'img/slide-3.jpg', href: '#/servicios/patrimonio' },
  { img: 'img/slide-4.jpg', href: '#/tramites/portal' },
  { img: 'img/banner-sati.png', href: '#/tramites/portal' },
];

let sliderCurrent = 0;
let sliderTimer = null;

function renderSlider() {
  return `
    <section class="slider" id="sliderEl">
      <div class="slides-track">
        ${sliderSlides.map((s, i) => `
          <div class="slide ${i === 0 ? 'active' : ''}">
            <a href="${s.href}">
              <img src="${s.img}" alt="Slide ${i + 1}"
                   onerror="this.src='https://placehold.co/1657x442/b02b2d/ffffff?text=${encodeURIComponent(s.img)}'">
            </a>
          </div>
        `).join('')}
      </div>
      <button class="slider-arrow prev" onclick="sliderPrev()" aria-label="Anterior">‹</button>
      <button class="slider-arrow next" onclick="sliderNext()" aria-label="Siguiente">›</button>
      <div class="slider-dots" id="sliderDots">
        ${sliderSlides.map((_, i) => `
          <button class="${i === 0 ? 'active' : ''}" onclick="sliderGo(${i})" aria-label="Ir al slide ${i + 1}"></button>
        `).join('')}
      </div>
    </section>
  `;
}

function updateSliderUI() {
  const slides = document.querySelectorAll('#app .slide');
  const dots = document.querySelectorAll('#app .slider-dots button');
  slides.forEach((s, i) => s.classList.toggle('active', i === sliderCurrent));
  dots.forEach((d, i) => d.classList.toggle('active', i === sliderCurrent));
}
function sliderNext() {
  sliderCurrent = (sliderCurrent + 1) % sliderSlides.length;
  updateSliderUI();
  restartSliderAutoplay();
}
function sliderPrev() {
  sliderCurrent = (sliderCurrent - 1 + sliderSlides.length) % sliderSlides.length;
  updateSliderUI();
  restartSliderAutoplay();
}
function sliderGo(i) {
  sliderCurrent = i;
  updateSliderUI();
  restartSliderAutoplay();
}
function restartSliderAutoplay() {
  clearInterval(sliderTimer);
  sliderTimer = setInterval(() => {
    sliderCurrent = (sliderCurrent + 1) % sliderSlides.length;
    updateSliderUI();
  }, 7000);
}
function attachSliderHover() {
  const el = document.getElementById('sliderEl');
  if (!el) return;
  el.addEventListener('mouseenter', () => clearInterval(sliderTimer));
  el.addEventListener('mouseleave', restartSliderAutoplay);
}

             onerror="this.src='https://picsum.photos/768/1365?random=${n.id}'">

      <div class="noticia-cat">${n.cat}</div>
      <h3 class="noticia-title">${n.title}</h3>
      <div class="noticia-date">${n.date}</div>
      <span class="noticia-more">Leer más →</span>
    </article>
  `;
}

function renderNoticiaDetalle(id) {
  const n = noticias.find(x => x.id === Number(id));
  if (!n) return renderGenerica('Noticia no encontrada', 'La noticia que buscás no existe.');
  return `
    <div class="vista-detalle">
      <a href="#/" class="volver">← Volver al inicio</a>
      <div class="cat">${n.cat}</div>
      <h1>${n.title}</h1>
      <div class="fecha">${n.date}</div>
      <img class="principal" src="${n.img}" alt="${n.title}"
           onerror="this.src='https://picsum.photos/1200/675?random=${n.id}'">
      <div class="cuerpo">
        <p>Este es un demo.</p>
        <p>Demo</p>
        <p>Cada una de estas secciones sería alimentada por un CMS real y renderizada.</p>
      </div>
    </div>
  `;
}

function renderGenerica(titulo, descripcion) {
  return `
    <div class="vista-generica">
      <h1>${titulo}</h1>
      <p>${descripcion}</p>
      <div class="placeholder-box">
        Marcos Puto.
      </div>
    </div>
  `;
}

/* =====================================================
   BUSCADOR
   ===================================================== */
function filtrarNoticias(query) {
  const grid = document.getElementById('noticiasGrid');
  if (!grid) return;
  const q = query.toLowerCase().trim();
  const filtradas = q
    ? noticias.filter(n =>
        n.title.toLowerCase().includes(q) ||
        n.cat.toLowerCase().includes(q))
    : noticias;
  grid.innerHTML = filtradas.length
    ? filtradas.map(noticiaCardHTML).join('')
    : '<p style="grid-column:1/-1;text-align:center;color:#797979;">No se encontraron resultados.</p>';
}

/* =====================================================
   ROUTER
   ===================================================== */
function navigateTo(hash) {
  if (window.location.hash === hash) {
    renderRoute();
  } else {
    window.location.hash = hash;
  }
}

function renderRoute() {
  const hash = window.location.hash || '#/';
  const app = document.getElementById('app');

  document.querySelectorAll('.main-nav > ul > li').forEach(li => li.classList.remove('current-menu-item'));

  if (hash.startsWith('#/noticia/')) {
    const id = hash.split('/')[2];
    app.innerHTML = renderNoticiaDetalle(id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  if (hash === '#/' || hash === '') {
    app.innerHTML = renderHome();
    document.querySelectorAll('.main-nav > ul > li').forEach(li => {
      if (li.querySelector('a')?.textContent.trim() === 'Inicio') {
        li.classList.add('current-menu-item');
      }
    });
    attachSliderHover();
    clearInterval(sliderTimer);
    sliderCurrent = 0;
    restartSliderAutoplay();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const partes = hash.replace('#/', '').split('/');
  const path = partes.map(p => decodeURIComponent(p));
  const titulo = path.map(p => {
    const label = encontrarLabel(menuItems, p);
    return label || (p.charAt(0).toUpperCase() + p.slice(1).replace(/-/g, ' '));
  }).join(' › ');

  app.innerHTML = renderGenerica(titulo, 'Sección de demostración educativa.');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function encontrarLabel(items, key) {
  for (const item of items) {
    if (item.href) {
      const slug = item.href.replace('#/', '').split('/').pop();
      if (slug === key) return item.label;
    }
    if (item.children) {
      const found = encontrarLabel(item.children, key);
      if (found) return found;
    }
  }
  return null;
}

window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', renderRoute);
if (document.readyState !== 'loading') renderRoute();
</script>
